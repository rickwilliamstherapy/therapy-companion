function doneTx(){const f=(S.fb||[]).find(x=>x.id===flow.fbId),risk=f&&f.say&&RISK.test(f.say);return `<section><div class="doneart">${ART.check}</div><h1>${f?'Thank you':'No problem'}</h1><p class="sub">${f?'Your therapist will see this. It helps shape how therapy fits you.':'Nothing was saved. You can do this any time.'}</p>${risk?safetyHTML('If you might hurt yourself or someone else, get help now'):''}<button class="btn" data-act="finish">Done</button></section>`}
function doneHTML(){const k=flow.kind;return k==='tx'?doneTx():k==='checkin'?doneCheckin():k==='pulse'?donePulse():k==='follow'?doneFollow():doneRel()}
const askCard=(act,id,cur)=>PUB()?'':`<div class="card ask"><h2>${KID()?'Want to tell your therapist about this next time?':'Would you like to discuss this in your next session?'}</h2><div class="yn2"><button class="btn ghost" data-act="${act}" data-v="${id}" data-k="1" aria-pressed="${cur===true}">Yes</button><button class="btn ghost" data-act="${act}" data-v="${id}" data-k="0" aria-pressed="${cur===false}">Not this time</button></div></div>`;
const bringBtn=en=>en&&en.id?askCard('bring-set',en.id,en.asked?!!en.bring:undefined):'';
function doneCheckin(){
  const en=S.entries.find(x=>x.id===flow.entryId)||{level:0,after:0,flags:[]};
  const T=tierOf(en.level),ok=en.after<=1;
  let msg;
  if((en.opt||[]).length&&!en.skills.length)msg='You chose to leave the exercise for now. That is okay. Your check-in is saved, and the exercise is here whenever you want it.';
  else if(T===0)msg='You are in the goal zone. Noticing it builds the skill.';
  else if(ok)msg=`${en.level} to ${en.after}. You are back in the goal zone.`;
  else if(en.after>5&&T>=3)msg=`${en.level} to ${en.after}. That is still a lot to carry. Stay with slow breathing, or reach out to someone you trust.`;
  else if(en.after<=3)msg=`${en.level} to ${en.after}. That is real progress. Go ahead and move along with your day.`;
  else if((en.skills||[]).length>=3)msg=`${en.level} to ${en.after}. You gave it a real try, and that takes effort. Be gentle with yourself today.`;
  else msg=`${en.level} to ${en.after}. Not at 0 or 1 yet, and that is okay.`;
  const su=has(en,'urge','Drink or use')?'<div class="notice"><p>If you want support with the urge to drink or use, this helpline is free, confidential and open 24/7.</p></div>'+SA():'';
  const hot=en.after>=9||(en.flags||[]).length;
  const sf=hot?safetyHTML((en.flags||[]).length?'If you might hurt yourself or someone else, get help now':'If it stays this high, get help now'):'';
  const nudge=has(en,'area','Something with my partner')?`<div class="card"><h2>Want To Work On The Part With Your Partner?</h2><p class="muted" style="margin:0 0 12px">The Relationship check-in helps you find what is underneath and how to say it.</p><button class="btn ghost" data-act="start-rel">Open Relationship</button></div>`:'';
  if(en.kid){
    const ag=ageOf(en),yo=ag==='6-9',te=ag==='13-17';
    const all=kidList(),nb=KBD.filter(x=>kidBadges(all).includes(x[0])&&!kidBadges(all.filter(z=>z.id!==en.id)).includes(x[0]));
    const H=yo?['Yay!','You did it!','Great job telling about your feelings! You are getting really good at feelings.','Putting a feeling into words can help it feel smaller. Each time you practice, you get better at it.']:te?['Nice.','You did the hard part.','You stopped, put words to it, and looked at it instead of pushing it away.','Research shows that naming a feeling and noticing it in your body can lower its intensity. Practice makes it easier to handle things in the moment.']:['Awesome!','Great job checking in with yourself!','That takes courage, and you are building a real skill.','Research shows that putting a feeling into words can make it feel smaller. The more you practice, the easier it gets.'];
    const bd=!te&&nb.length?nb.map(b=>`<div class="nbadge"><i>${b[1]}</i><div><b>New badge: ${b[2]}</b><span>You earned it!</span></div></div>`).join(''):'';
    return `<section class="cel"><div class="celwrap" aria-hidden="true">${celConf(te?30:56)}<img class="celg" src="${WIMG.guy}" alt=""><span class="celb">${H[0]}</span></div><h1>${H[1]}</h1><p class="sub" style="margin-bottom:8px;color:var(--ink)">${H[2]}</p><p style="margin:0 0 14px;color:var(--ink);font-size:17px;line-height:1.45">${H[3]}${en.after>5?(te?' If it is still strong, reach out to someone you trust.':' Tell a grown-up if it is still big.'):''}</p>${bd}${receiptHTML(en.id)}${sf}${su}<div class="stack">${en.asked?'':bringBtn(en)}<button class="btn" data-act="finish">Done</button></div></section>`;
  }
  if(en.nxt||(en.skills||[]).length){
    return `<section class="cel"><div class="celwrap" aria-hidden="true">${celConf()}<img class="celg" src="${WIMG.guy}" alt=""><span class="celb">Nice work!</span></div><h1>You Processed That.</h1><p class="sub" style="margin-bottom:8px;color:var(--ink)">You paused, named what you felt, and stayed with it.</p><p style="margin:0 0 14px;color:var(--ink);font-size:16px;line-height:1.45">Research shows that naming a feeling and noticing it in your body can lower its intensity. With practice, it helps you respond to hard moments instead of reacting.${en.after>5?' Be gentle with yourself today.':''}</p>${receiptHTML(en.id)}${sf}${su}<div class="stack">${nudge}${en.asked?'':bringBtn(en)}<button class="btn" data-act="finish">Done</button></div></section>`;
  }

}
function donePulse(){

function chart(list,days){

  [0,5,10].forEach(v=>{g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`});

  list.forEach(en=>{const cx=x(+new Date(en.t)).toFixed(1);
    if(en.after!=null)m+=`<line class="seg-l" x1="${cx}" x2="${cx}" y1="${y(en.level)}" y2="${y(en.after)}"/><circle class="dot end" cx="${cx}" cy="${y(en.after)}" r="5"/>`;

      P.need(ls.length*12+3);const y=P.y();P.text(M,y+9,when,9);P.text(M+120,y+9,e.level+' to '+(e.after==null?'-':e.after),9,true);ls.forEach((l,i)=>P.text(M+190,y+9+i*12,l,9));P.sety(y+ls.length*12+3)});

async function savePDF(){
  const msg=$('#pdfmsg');const set=t=>{if(msg)msg.textContent=t};
  let bytes;
  try{bytes=makePDF()}catch(e){set('Sorry, the report could not be built.');return}
  const name='My-Progress-Report-'+dayKey(new Date())+'.pdf';
  try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:bytes.buffer});set('Saved. Check your downloads or the share sheet.');return}}
  catch(e){if(e&&e.code==='declined'){set('No problem. You can download it any time.');return}}
  try{const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);set('Your report is downloading.')}
  catch(e){set('Downloads are not available here. Try opening this page in your browser.')}
}

 {k:'stress',t:'Daily Check-In Talk',c:['Talk'],tm:'ab',how:['Pick who talks first. About 5 to 7 minutes each.','Share one thing from your day or week outside the relationship: work, family, friends, health.','The listener takes their side and asks questions. No fixing unless asked.',LB,'Switch.'],why:'Couples who help each other with everyday outside stress stay closer and more satisfied. Feeling that your partner is on your side matters more than solving the problem.',b:'Turning Toward Each Other',src:'Falconier et al., 2015. Gottman, the stress-reducing conversation.'},
 {k:'lovemap',t:'Know Your Person',c:['Talk','Out','Fun','Touch'],tm:'abc',dk:'Know Your Person',e:'🔍',how:['Take turns answering. Great at dinner, picnics, walks or in the car.',LB,'Next card. Stop while it is still fun.'],deck:['What is something you are looking forward to this month?','Who is a friend you would like to see more of?','What is a small thing that made you happy this week?','What song or show have you had on repeat lately?','What would a perfect lazy Sunday look like for you?','If you could learn any skill this year, what would it be?','What is a place you want to go back to, and why?','What is something you wish more people knew about you?','What did you love doing as a kid that you rarely do now?','What is a goal you are quietly working toward?','When do you feel most like yourself?','What is something you have changed your mind about?'],ic:['📅','👋','😊','🎵','🛋️','🎯','📍','💭','🪁','🌱','✨','🔄'],why:'Knowing the small details of your partner\'s world, and keeping that knowledge current, builds the friendship that holds a relationship up. Couples who keep asking handle stress and change better.',more:['Think of it as an inner picture of your partner\'s world: their worries, hopes, friends and favorites.','Partners with detailed maps tend to handle stress and big changes better, because they know what is going on inside each other.','Maps go out of date as life changes. Asking keeps yours current, and asking says "you matter to me."'],b:'Knowing Each Other',src:'Based on Gottman\'s research on how well partners know each other\'s inner world (Gottman and Silver, 1999). Aron et al., 1997.'},
 {k:'dinner',t:'Dinner Table Talk',c:['Out','Fun','Talk'],tm:'abc',dk:'Dinner Table',e:'🍽️',bring:'lovemap',how:['Phones face down. First to grab one does the dishes.','Each share a high, a low and something you are looking forward to.','Play a few cards while you eat.'],deck:['What was the best bite of your day so far?','What was your high today? Your low?','What is one thing you are looking forward to this week?','Who made you laugh lately?','What meal reminds you of growing up?','If we could eat anywhere in the world tonight, where?','What is something you did this week you are proud of?','What would you want to celebrate this month?'],ic:['😋','🌗','🔭','😂','🥘','🌍','🏅','🎉'],why:'Shared meals are one of the easiest daily rituals of connection. Asking about each other\'s day and celebrating the good parts keeps you close.',more:['Small rituals you repeat, like dinner talk, are part of what keeps couples connected over time.','Sharing a high and a low gives both good news and stress a place to land.','Responding warmly to each other\'s good news predicts closeness and trust.'],b:'Rituals Of Connection',src:'Gottman and Silver, 1999. Gable et al., 2004.'},
 {k:'picnic',t:'Picnic And Play Cards',c:['Out','Fun'],tm:'bcd',dk:'Picnic Play',e:'🧺',bring:'lovemap',how:['Bring a blanket and a snack. Park, beach or backyard.','Draw a card. Both answer. Laugh at the misses.','End with one photo of the two of you.'],deck:['Would you rather have a picnic at the beach or in the mountains?','Two truths and a dream: tell me two true things and one thing you wish for.','What is the best snack ever invented?','If we had a free Saturday and no budget, what would we do?','What animal are you most like today?','What is a silly thing that always makes you smile?','Describe our perfect day using only three words.','What is a song that should be playing right now?'],ic:['🏖️','🤞','🍓','🎈','🦦','🙃','✌️','🎶'],why:'Playing and laughing together builds closeness. Doing something new and fun as a pair can bring back the spark of early dating.',more:['Couples who share laughter tend to feel closer and more supported.','Fun, new activities together are linked to higher relationship satisfaction.','Light questions open the door to deeper ones without pressure.'],b:'Fun And Friendship',src:'Kurtz and Algoe, 2015. Aron et al., 2000.'},
 {k:'appreciate',t:'Appreciation Round',c:['Talk','Out','Fun'],tm:'a',dk:'Appreciation',e:'💐',how:['Take turns drawing a card and finishing the sentence about your partner.','Be specific. Name what they did and what it meant to you.','The listener just says thank you. No brushing it off.'],deck:['Something you did this week that I appreciated was...','One thing I admire about how you handle hard days is...','A moment I felt proud to be with you was...','Something small you do that makes my day easier is...','A quality of yours I hope our people notice is...','I felt cared for when you...'],ic:['🙏','💪','🌟','☕','💎','🫶'],why:'Noticing and saying what you appreciate builds fondness and admiration, a buffer couples lean on during hard times.',more:['Research on lasting couples finds fondness and admiration are a core part of a strong friendship.','Feeling appreciated by a partner is linked to feeling closer and more committed.','Specific thanks lands better than general praise.'],b:'Fondness And Admiration',src:'Gottman and Silver, 1999. Algoe, Gable and Maisel, 2010.'},
 {k:'good',t:'Good News, Full Attention',c:['Talk'],tm:'a',how:['Each of you shares one good thing from the week, big or small.','The listener puts the phone down, turns toward them, and looks up.','Ask two questions so they can relive it: "What was the best part?" "How did it feel?"','Say what it means to you: "I love seeing you like this."','Switch.'],why:'How partners respond to each other\'s good news predicts closeness and trust, sometimes more than how they respond to bad news. Many people have never practiced listening to the good stuff.',b:'Fondness And Admiration',src:'Gable et al., 2004. Gable, Gonzaga and Strachman, 2006.'},
 {k:'story',dk:'Story Of Us',e:'📖',t:'The Story Of Us',c:['Talk','Touch'],tm:'bc',how:['Sit together. Take turns with the cards. Tell it like a story.','Notice the details your partner remembers that you forgot.',LB,'End by naming one moment from your story you are proud of.'],deck:['How did we first meet? What did you notice about me?','What made you want to see me again?','What do you remember about our first date?','When did you know this was something real?','What was a hard time we got through together? How did we do it?','What is a favorite memory from our first year?','What is a tradition or inside joke that started early?','What is one thing about us you hope never changes?'],why:'How couples tell the story of their relationship, with warmth and "we" language, predicts how the relationship goes years later. Retelling the good parts rebuilds fondness.',b:'Fondness And Admiration',src:'Buehlman, Gottman and Katz, 1992. Gottman, the Oral History Interview.'},

 {k:'guess',dk:'Guess My Answer',e:'🎲',t:'Guess My Answer',c:['Fun','Talk'],tm:'ab',how:['Read the card. Guess what your partner would say.','Your partner gives the real answer. One point for each match.','A miss is the best part. Ask about it.'],deck:['My favorite way to spend an hour alone','The food I could eat every week','A song that always lifts my mood','The chore I dislike the most','Where I would go if we left tomorrow','What I am most stressed about right now','My favorite thing we do together','A show or movie I could watch again','The best gift I ever got','What helps me most after a hard day'],why:'Laughing together is linked to feeling closer and more satisfied. The game also shows you what you know and what you have missed.',b:'Knowing Each Other And Play',src:'Kurtz and Algoe, 2015. Gottman and Silver, 1999.'},
 {k:'cook',bring:'lovemap',t:'Cook Something New Together',c:['Fun'],tm:'bc',how:['Pick a recipe neither of you has made.','Split the jobs. One chops, one cooks. Trade halfway.','Easy idea: sheet-pan nachos. Chips, beans, cheese and toppings at 400 degrees for 8 to 10 minutes.','Eat together with phones away.'],links:[['Or Order In Together','https://www.doordash.com/']],why:'Doing something new together, even a small thing, is linked to higher relationship satisfaction than doing the usual.',b:'Growing Together',src:'Aron et al., 2000. Coulter and Malouff, 2013.'},

 {k:'outdoors',bring:'lovemap',t:'Outdoors Together',c:['Out'],tm:'bcde',how:['Pick a spot. A favorite you love or somewhere you have never been. Both count.','Ideas: a park, a beach, a trail, a lake, a bike ride, a picnic, a sunset or stargazing.','Phones on silent. Notice one thing together you have not noticed before.','Share a snack or a drink and talk about anything except chores and problems.'],links:[['Parks Nearby',MAPQ('parks near me')],['Trails Nearby',MAPQ('hiking trails near me')],['Beaches Or Lakes',MAPQ('beaches and lakes near me')],['Picnic Spots',MAPQ('picnic areas near me')]],why:'Relaxed time together is linked to more closeness, and time outdoors lowers stress for each of you. Going back to a place you love can bring back good shared memories.',b:'Turning Toward Each Other',src:'Girme, Overall and Faingataa, 2014. Bratman et al., 2019.'},
 {k:'novel',bring:'lovemap',t:'Try Something New Together',c:['Out','Fun'],tm:'cde',how:['Pick something neither of you has done before, or not in a long time.','Ideas: a class, an escape room, bowling, mini golf, rock climbing, karaoke, a day trip, a new neighborhood.','Go in as teammates. Nobody has to be good at it. Laughing at yourselves is part of it.','On the way home, each name your favorite moment.'],links:[['Classes Nearby',GQ('classes for couples near me')],['Fun Things To Do',MAPQ('fun things to do near me')],['Free Things To Do',GQ('free things to do near me this weekend')]],why:'New and exciting activities give a relationship a lift that routine ones do not. Couples who did them together for about 90 minutes a week reported higher satisfaction than couples who did familiar pleasant things.',b:'Growing Together',src:'Aron et al., 2000. Coulter and Malouff, 2013.'},

 {k:'sensate',t:'Touch Without A Goal',c:['Touch'],tm:'bc',how:['A gentle version of sensate focus. Set a timer. One gives, one receives, 10 to 15 minutes each. Stay clothed if you like.','The giver touches hands, arms, back, shoulders or face. Not breasts or genitals. This is not leading to sex.','Both focus only on what the touch feels like: warm, cool, soft, slow. When your mind wanders, bring it back to the touch.','The receiver can say "slower," "lighter" or "stop" at any time. Switch.','Afterward, each say one thing you noticed.'],why:'Sensate focus is a core tool in couples and sex therapy. Taking away any goal lowers pressure and helps partners enjoy touch and feel safe. Warm touch at home has also been linked to lower stress.',b:'Safety, Affection And Closeness',src:'Masters and Johnson, 1970. Weiner and Avery-Clark, 2017. Holt-Lunstad et al., 2008.',care:'If touch brings up pain, fear or hard memories, stop and talk about it with your therapist.'},

 {k:'spark',adult:1,t:'Slow Build',c:['Touch'],tm:'bc',dk:'Slow Build',e:'🕯️',how:['Pick a private, unhurried time. Phones off.','Start at Warm Up. Take turns with the cards.','Move up a level only when you both want to. Either of you can pause or stop anytime.','Closeness is the goal. Nothing has to lead anywhere.'],care:'If touch or intimacy brings up pain, fear or hard memories, stop and talk about it with your therapist.',why:'For many couples, desire grows out of feeling close and safe, not the other way around. Talking openly and touching without pressure helps rebuild intimacy step by step.',more:['Sensate focus, a core sex therapy tool, takes the goal away so touch can feel safe and enjoyable again.','For many people, desire shows up after closeness begins. Starting slow is not a step backward.','Couples who talk openly about intimacy tend to report more relationship and sexual satisfaction.'],b:'Safety, Affection And Closeness',src:'Masters and Johnson, 1970. Weiner and Avery-Clark, 2017. Basson, 2000. Mallory, 2022.'}

function introModal(){
  const pub=PUB();
  const rows=pub?[['i1','For reflection','Personal reflection and general education only. Not therapy, medical advice, diagnosis or treatment.'],['i2','Private to you','Nobody is watching. Your entries stay on this device. You must be 18 or older.'],['i3','Want a therapist?','California residents can text or call <span style="white-space:nowrap">'+TX.show+'</span> (please avoid private health details here).']]
  :[['i1','Support for your journey','This companion supports your therapy but does not replace it, and it is not an emergency service.'],['i2','Reviewing together','Since check-ins are not watched live, your therapist will review them with you.'],['i3','Scheduling and cancels','Text or call <span style="white-space:nowrap">'+TX.show+'</span> (please avoid private health details here).']];
  return `<div class="icard" role="dialog" aria-modal="true" aria-labelledby="ih"><h2 class="wt" id="ih">${S.seen?'Welcome back!':'Welcome!'}</h2><div class="ihead"><span class="gw"><img src="${WIMG.guy}" width="88" height="88" alt=""></span><div class="bub"><span>${S.seen?'I am so glad you are back! A few quick things before we start.':'I am so glad you are here! A few quick things before we start.'}</span></div></div><ul>${rows.map(r=>`<li><img src="${WIMG[r[0]]}" width="38" height="38" alt=""><span><b>${r[1]}</b> &mdash; ${r[2]}</span></li>`).join('')}</ul><div class="urg"><svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path d="M12 3l10 18H2z" fill="#f08a78"/><path d="M12 9v6M12 17.500v.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span><b>Need urgent help?</b> If you or someone else is in danger, tap <b>Help now</b> or call ${pub?'or text ':''}988 or 911.</span></div><button class="btn big" data-act="got-it" id="intro-ok">I understand and agree</button>${pub?'<button class="back" data-act="open-about" style="width:100%;justify-content:center;margin-top:2px;min-height:36px">Read the full terms</button>':''}</div>`;
}
function syncIntro(){
  let m=$('#intro');if(!m){m=document.createElement('div');m.id='intro';document.body.appendChild(m)}
  const on=(showIntro||!introAck)&&!aboutOpen;
  if(on&&m.hidden!==false||(on&&!m.innerHTML)){m.innerHTML=introModal();m.hidden=false;setTimeout(()=>{const b=$('#intro-ok');if(b)b.focus()},30)}
  else if(!on){m.hidden=true;m.innerHTML=''}
}

function micDecorate(){
  document.querySelectorAll('#view textarea.ta:not([readonly])').forEach(ta=>{
    if(ta.parentNode.classList.contains('micwrap'))return;
    const w=document.createElement('div');w.className='micwrap';
    const mb=parseFloat(getComputedStyle(ta).marginBottom)||0;w.style.marginBottom=mb+'px';
    ta.parentNode.insertBefore(w,ta);w.appendChild(ta);
    if(SPRC){const b=document.createElement('button');b.type='button';b.className='micbtn';b.setAttribute('aria-label','Talk to type');b.setAttribute('aria-pressed','false');b.innerHTML=MICSVG;b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();micToggle(ta,b)});w.appendChild(b)}
